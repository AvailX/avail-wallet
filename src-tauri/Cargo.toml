[package]
name = "wallet"
description = "Avail Wallet | Make it yours."
version = "0.4.4"
authors = ["Avail"]
license = "Apache-2.0"
repository = "https://github.com/availx/avail-wallet"
edition = "2021"

[lib]
name = "availx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-plugin-fs = { version = "=2.0.0-rc.0", features = [] }
tauri-plugin = { version = "=2.0.0-rc.0", features = [] }
tauri-utils = { version = "=2.0.0-rc.0", features = [] }
tauri-build = { version = "=2.0.0-rc.0", features = [] }

[dependencies]
snarkvm = { features = [
    "wasm",
], git = "https://github.com/AleoNet/snarkVM", rev = "be171ce" }
tauri-plugin-http = { version = "2.0.0-rc.0", features = ["cookies"] }
curl-sys = "0.4.72"
avail-common = { git = "https://github.com/availx/avail-lib", rev = "eabdde3", features = [
    "snarkvm",
] }
bs58 = "0.5.0"
chrono = "0.4.26"
dirs = "5.0.1"
dotenv = "0.15.0"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
futures = "0.3.28"
jni = { version = "0.21.1" }
keyring = "2.0.5"
libc = "0.2.147"
log = "0.4.19"
simplelog = "0.12.2"
tail = "0.3.0"
once_cell = "1.18.0"
openssl = { version = "0.10.36", features = ["vendored"] }
rand = "0.8.5"
rayon = "1.7.0"
rusqlite = { version = "0.31.0", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.120"
ssss = "0.2.0"
tauri = { version = "2.0.0-rc.0", features = [] }
tauri-plugin-deep-link = "2.0.0-rc.0"
tauri-plugin-updater = { version = "2.0.0-rc.0", features = [] }
tauri-plugin-process = "2.0.0-rc.0"
tiny-bip39 = "1.0.0"
time = "0.3.36"
tokio = { version = "1.29.1", features = ["full"] }
tokio-rayon = "2.1.0"
ureq = { version = "2.7.1", features = ["json"] }
uuid = { version = "1.4.1", features = ["v4", "serde"] }
whoami = "1.4.1"
zeroize = { version = "1.7.0", features = [
    "aarch64",
    "zeroize_derive",
    "alloc",
] }
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies] # tauri-plugin-deep-link = "0.1.2"colored = "2.1.0"# devtools = "0.3.1"
# devtools = "0.3.1"
# tauri-plugin-devtools = { git = "https://github.com/crabnebula-dev/devtools", version = "2.0.0-beta.0" }
cargo-xcode = "1.10.0"
http = "1.1.0"
tauri-plugin-barcode-scanner = "2.0.0-rc.0"
# tauri-plugin-deep-link = "2.0.0-beta.3"
security-framework = { git = "https://github.com/AvailX/rust-security-framework" }
app_dirs = { package = "app_dirs2", version = "2.5" }
security-framework-sys = { git = "https://github.com/AvailX/rust-security-framework" }
core-foundation = "0.9.3"
tid-rs = { git = "https://github.com/Zack-Xb/tid-rs" }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1.1"

[target.'cfg(target_os = "ios")'.dependencies]
snarkvm = { features = [
    "wasm",
], git = "https://github.com/AleoNet/snarkVM", rev = "d170a9f" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
snarkvm = { features = [
    "wasm",
], git = "https://github.com/AleoNet/snarkVM", rev = "d170a9f" }

[profile.release]
opt-level = 3
lto = "thin"
incremental = true

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 3
lto = "thin"
incremental = true


[profile.test]
opt-level = 3
lto = "thin"
incremental = true

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
rstest = "0.18.2"

[package.metadata.ios]
# Required
build_targets = ["aarch64-apple-ios"]
